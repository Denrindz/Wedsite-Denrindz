<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Denrindz — Developer</title>

<style>

/* =========================
   VARIABLES
========================= */

:root {
    --teal: #008080;
    --bg: #050909;
    --white: #ffffff;

    --glass: rgba(255,255,255,0.055);
    --glass-hover: rgba(0,128,128,0.08);

    --border: rgba(255,255,255,0.10);
}


/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =========================
   BODY
========================= */

body {
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: var(--bg);

    color: var(--white);

    min-height: 100vh;
}


/* Ánh sáng nền mềm */

body::before {

    content: "";

    position: fixed;

    width: 420px;
    height: 420px;

    background:
        rgba(0,128,128,0.10);

    filter:
        blur(120px);

    border-radius: 50%;

    top: -180px;

    left: 50%;

    transform:
        translateX(-50%);

    pointer-events: none;

    z-index: -1;
}


/* =========================
   CONTAINER
========================= */

.container {

    width:
        min(950px, 92%);

    margin:
        auto;
}


/* =========================
   HEADER
========================= */

header {

    padding:
        28px 0 10px;

    display:
        flex;

    align-items:
        center;

    gap:
        12px;
}


.avatar {

    width:
        46px;

    height:
        46px;

    border-radius:
        50%;

    object-fit:
        cover;

    border:
        1px solid
        rgba(255,255,255,0.12);
}


.logo {

    font-size:
        20px;

    font-weight:
        800;
}


/* =========================
   HERO
========================= */

.hero {

    text-align:
        center;

    padding:
        65px 0 55px;
}


.hero h1 {

    font-size:
        clamp(58px, 15vw, 120px);

    font-weight:
        900;

    letter-spacing:
        -5px;

    color:
        #ffffff;

    /*
       Hiệu ứng kính mềm
       nhưng chữ vẫn đậm
    */

    background:
        linear-gradient(
            110deg,
            #ffffff 0%,
            #ffffff 35%,
            #d9ffff 50%,
            #ffffff 65%,
            #ffffff 100%
        );

    background-size:
        220% 100%;

    -webkit-background-clip:
        text;

    -webkit-text-fill-color:
        transparent;

    filter:
        drop-shadow(
            0 0 10px
            rgba(255,255,255,0.10)
        )
        drop-shadow(
            0 0 20px
            rgba(0,128,128,0.08)
        );

    animation:
        glassMove 5s ease-in-out infinite;
}


@keyframes glassMove {

    0%,
    100% {

        background-position:
            0% 50%;
    }

    50% {

        background-position:
            100% 50%;
    }
}


.hero p {

    margin-top:
        14px;

    color:
        rgba(255,255,255,0.45);

    font-size:
        14px;
}


/* =========================
   CATEGORY
========================= */

.categories {

    display:
        grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap:
        14px;
}


.category {

    padding:
        25px 20px;

    background:
        var(--glass);

    border:
        1px solid
        var(--border);

    border-radius:
        20px;

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    cursor:
        pointer;

    transition:
        0.25s ease;
}


.category:hover {

    transform:
        translateY(-3px);

    border-color:
        rgba(0,128,128,0.5);

    background:
        var(--glass-hover);
}


.category-icon {

    font-size:
        25px;

    margin-bottom:
        18px;
}


.category h2 {

    font-size:
        17px;

    font-weight:
        800;
}


.category p {

    margin-top:
        7px;

    color:
        rgba(255,255,255,0.42);

    font-size:
        12px;
}


/* =========================
   CONTACT
========================= */

.contact-title {

    font-size:
        18px;

    margin:
        35px 0 14px;
}


.contacts {

    display:
        grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap:
        14px;
}


.contact {

    display:
        block;

    text-decoration:
        none;

    color:
        white;

    padding:
        20px;

    background:
        var(--glass);

    border:
        1px solid
        var(--border);

    border-radius:
        18px;

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    transition:
        0.25s ease;
}


.contact:hover {

    transform:
        translateY(-3px);

    border-color:
        rgba(0,128,128,0.5);

    background:
        var(--glass-hover);
}


.contact-name {

    font-size:
        12px;

    color:
        rgba(255,255,255,0.42);

    margin-bottom:
        8px;
}


.contact-value {

    font-size:
        14px;

    font-weight:
        700;

    word-break:
        break-word;
}


/* =========================
   PAGE
========================= */

.page {

    display:
        none;

    padding:
        35px 0;
}


.page.active {

    display:
        block;
}


.page-header {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    margin-bottom:
        25px;
}


.page-header h2 {

    font-size:
        34px;
}


.back {

    border:
        1px solid
        var(--border);

    background:
        var(--glass);

    color:
        white;

    padding:
        10px 15px;

    border-radius:
        12px;

    cursor:
        pointer;

    font-size:
        14px;

    transition:
        0.2s;
}


.back:hover {

    background:
        var(--glass-hover);

    border-color:
        rgba(0,128,128,0.5);
}


/* =========================
   GALLERY
========================= */

.gallery {

    display:
        grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap:
        14px;
}


.gallery img {

    width:
        100%;

    display:
        block;

    border-radius:
        18px;

    border:
        1px solid
        var(--border);

    background:
        var(--glass);

    transition:
        0.25s ease;
}


.gallery img:hover {

    transform:
        scale(1.02);
}


/* =========================
   FOOTER
========================= */

footer {

    text-align:
        center;

    padding:
        35px 0 25px;

    color:
        rgba(255,255,255,0.25);

    font-size:
        12px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    .categories {

        grid-template-columns:
            1fr;
    }


    .contacts {

        grid-template-columns:
            1fr;
    }


    .gallery {

        grid-template-columns:
            repeat(2, 1fr);
    }


    .hero {

        padding:
            55px 0 45px;
    }


    .hero h1 {

        letter-spacing:
            -3px;
    }


    .page-header h2 {

        font-size:
            28px;
    }

}

</style>
</head>


<body>

<script>

/* =====================================================
   MỞ MỤC
===================================================== */

function openPage(page) {

    /* Ẩn trang chủ */

    document
        .getElementById("home")
        .style.display = "none";


    /* Ẩn tất cả page */

    document
        .querySelectorAll(".page")
        .forEach(function(section) {

            section.classList.remove(
                "active"
            );

        });


    /* Hiện page được chọn */

    document
        .getElementById(page)
        .classList.add("active");


    /* Cuộn lên đầu */

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



/* =====================================================
   QUAY VỀ TRANG CHỦ
===================================================== */

function goHome() {

    /* Ẩn tất cả page */

    document
        .querySelectorAll(".page")
        .forEach(function(section) {

            section.classList.remove(
                "active"
            );

        });


    /* Hiện trang chủ */

    document
        .getElementById("home")
        .style.display = "block";


    /* Cuộn lên đầu */

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}

</script>
