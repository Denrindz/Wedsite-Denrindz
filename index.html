<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Denrindz — Developer</title>

<style>

:root {
    --teal: #008080;
    --bg: #050909;
    --white: #ffffff;
    --glass: rgba(255,255,255,.055);
    --border: rgba(255,255,255,.10);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: white;
    min-height: 100vh;
}

/* Ánh sáng nền */

body::before {
    content: "";
    position: fixed;

    width: 420px;
    height: 420px;

    background: rgba(0,128,128,.10);

    filter: blur(120px);

    border-radius: 50%;

    top: -180px;
    left: 50%;

    transform: translateX(-50%);

    pointer-events: none;
}

.container {
    width: min(950px, 92%);
    margin: auto;
}


/* =========================
   HEADER
========================= */

header {
    padding: 28px 0 10px;

    display: flex;
    align-items: center;

    gap: 12px;
}

.avatar {
    width: 46px;
    height: 46px;

    border-radius: 50%;

    object-fit: cover;

    border: 1px solid rgba(255,255,255,.12);
}

.logo {
    font-size: 20px;
    font-weight: 800;
}


/* =========================
   HERO
========================= */

.hero {
    text-align: center;

    padding: 65px 0 55px;
}

.hero h1 {

    font-size: clamp(58px, 15vw, 120px);

    font-weight: 900;

    letter-spacing: -5px;

    color: #fff;

    background:
        linear-gradient(
            110deg,
            #ffffff 0%,
            #ffffff 35%,
            #d9ffff 50%,
            #ffffff 65%,
            #ffffff 100%
        );

    background-size: 220% 100%;

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    filter:
        drop-shadow(0 0 10px rgba(255,255,255,.10))
        drop-shadow(0 0 20px rgba(0,128,128,.08));

    animation: glassMove 5s ease-in-out infinite;
}

@keyframes glassMove {

    0%,100% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

}

.hero p {

    margin-top: 14px;

    color: rgba(255,255,255,.45);

    font-size: 14px;
}


/* =========================
   CATEGORY
========================= */

.categories {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 14px;
}

.category {

    padding: 25px 20px;

    background: var(--glass);

    border: 1px solid var(--border);

    border-radius: 20px;

    backdrop-filter: blur(18px);

    -webkit-backdrop-filter: blur(18px);

    cursor: pointer;

    transition: .25s;
}

.category:hover {

    transform: translateY(-3px);

    border-color:
        rgba(0,128,128,.5);

    background:
        rgba(0,128,128,.08);
}

.category-icon {

    font-size: 25px;

    margin-bottom: 18px;
}

.category h2 {

    font-size: 17px;

    font-weight: 800;
}

.category p {

    margin-top: 7px;

    color:
        rgba(255,255,255,.42);

    font-size: 12px;
}


/* =========================
   CONTACT
========================= */

.contact-title {

    font-size: 18px;

    margin:
        35px 0 14px;
}

.contacts {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 14px;
}

.contact {

    display: block;

    text-decoration: none;

    color: white;

    padding: 20px;

    background:
        var(--glass);

    border:
        1px solid var(--border);

    border-radius: 18px;

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    transition: .25s;
}

.contact:hover {

    transform:
        translateY(-3px);

    border-color:
        rgba(0,128,128,.5);

    background:
        rgba(0,128,128,.08);
}

.contact-name {

    font-size: 12px;

    color:
        rgba(255,255,255,.42);

    margin-bottom: 8px;
}

.contact-value {

    font-size: 14px;

    font-weight: 700;

    word-break: break-word;
}


/* =========================
   PAGE
========================= */

.page {

    display: none;

    padding: 35px 0;
}

.page.active {

    display: block;
}

.page-header {

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    margin-bottom: 25px;
}

.page-header h2 {

    font-size: 34px;
}

.back {

    border:
        1px solid var(--border);

    background:
        var(--glass);

    color: white;

    padding: 10px 15px;

    border-radius: 12px;

    cursor: pointer;

    font-size: 14px;
}


/* =========================
   GALLERY
========================= */

.gallery {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 14px;
}

.gallery img {

    width: 100%;

    display: block;

    border-radius: 18px;

    border:
        1px solid var(--border);

    background:
        var(--glass);

    transition: .25s;
}

.gallery img:hover {

    transform:
        scale(1.02);
}


/* =========================
   FOOTER
========================= */

footer {

    text-align: center;

    padding:
        35px 0 25px;

    color:
        rgba(255,255,255,.25);

    font-size: 12px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px) {

    .categories,
    .contacts {

        grid-template-columns:
            1fr;
    }

    .gallery {

        grid-template-columns:
            repeat(2,1fr);
    }

    .hero {

        padding:
            55px 0 45px;
    }

    .hero h1 {

        letter-spacing:
            -3px;
    }

    .page-header h2 {

        font-size: 28px;
    }

}

</style>
</head>


<body>

<div class="container">


<!-- =========================
     HEADER
========================= -->

<header>

    <!-- TÊN FILE ẢNH ĐÚNG CỦA MÀY -->

    <img
        src="IMG_1496.jpeg"
        class="avatar"
        alt="Denrindz"
    >

    <div class="logo">
        Denrindz
    </div>

</header>



<!-- =========================
     TRANG CHÍNH
========================= -->

<main id="home">


    <section class="hero">

        <h1>
            Denrindz
        </h1>

        <p>
            Developer & Digital Creator
        </p>

    </section>



    <!-- =====================
         CÁC MỤC
    ====================== -->

    <section class="categories">


        <div
            class="category"
            onclick="openPage('wallpaper')"
        >

            <div class="category-icon">
                ◈
            </div>

            <h2>
                Wallpaper
            </h2>

            <p>
                View wallpapers
            </p>

        </div>



        <div
            class="category"
            onclick="openPage('aircard')"
        >

            <div class="category-icon">
                ◇
            </div>

            <h2>
                AirCard
            </h2>

            <p>
                View AirCard
            </p>

        </div>



        <div
            class="category"
            onclick="openPage('passcode')"
        >

            <div class="category-icon">
                ▣
            </div>

            <h2>
                Theme Passcode
            </h2>

            <p>
                View themes
            </p>

        </div>


    </section>



    <!-- =====================
         LIÊN HỆ
    ====================== -->

    <h2 class="contact-title">
        Thông tin liên hệ
    </h2>


    <section class="contacts">


        <!-- EMAIL -->

        <a
            class="contact"
            href="mailto:YOUR_EMAIL@example.com"
        >

            <div class="contact-name">
                Email
            </div>

            <div class="contact-value">
                YOUR_EMAIL@example.com
            </div>

        </a>



        <!-- TELEGRAM -->

        <a
            class="contact"
            href="https://t.me/YOUR_USERNAME"
            target="_blank"
            rel="noopener"
        >

            <div class="contact-name">
                Telegram
            </div>

            <div class="contact-value">
                @YOUR_USERNAME
            </div>

        </a>



        <!-- GITHUB -->

        <a
            class="contact"
            href="https://github.com/YOUR_USERNAME"
            target="_blank"
            rel="noopener"
        >

            <div class="contact-name">
                GitHub
            </div>

            <div class="contact-value">
                github.com/YOUR_USERNAME
            </div>

        </a>


    </section>

</main>



<!-- =========================
     WALLPAPER
========================= -->

<section
    id="wallpaper"
    class="page"
>

    <div class="page-header">

        <h2>
            Wallpaper
        </h2>

        <button
            class="back"
            onclick="goHome()"
        >
            ← Quay lại
        </button>

    </div>


    <div class="gallery">

        <img src="wallpaper/1.jpg">
        <img src="wallpaper/2.jpg">
        <img src="wallpaper/3.jpg">
        <img src="wallpaper/4.jpg">
        <img src="wallpaper/5.jpg">
        <img src="wallpaper/6.jpg">

    </div>

</section>



<!-- =========================
     AIRCARD
========================= -->

<section
    id="aircard"
    class="page"
>

    <div class="page-header">

        <h2>
            AirCard
        </h2>

        <button
            class="back"
            onclick="goHome()"
        >
            ← Quay lại
        </button>

    </div>


    <div class="gallery">

        <img src="aircard/1.jpg">
        <img src="aircard/2.jpg">
        <img src="aircard/3.jpg">
        <img src="aircard/4.jpg">
        <img src="aircard/5.jpg">
        <img src="aircard/6.jpg">

    </div>

</section>



<!-- =========================
     PASSCODE
========================= -->

<section
    id="passcode"
    class="page"
>

    <div class="page-header">

        <h2>
            Theme Passcode
        </h2>

        <button
            class="back"
            onclick="goHome()"
        >
            ← Quay lại
        </button>

    </div>


    <div class="gallery">

        <img src="passcode/1.jpg">
        <img src="passcode/2.jpg">
        <img src="passcode/3.jpg">
        <img src="passcode/4.jpg">
        <img src="passcode/5.jpg">
        <img src="passcode/6.jpg">

    </div>

</section>



<!-- =========================
     FOOTER
========================= -->

<footer>

    © 2026 Denrindz

</footer>


</div>



<script>

/* MỞ MỤC */

function openPage(page) {

    document
        .getElementById("home")
        .style.display = "none";


    document
        .querySelectorAll(".page")
        .forEach(function(section) {

            section.classList.remove(
                "active"
            );

        });


    document
        .getElementById(page)
        .classList.add("active");


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



/* QUAY VỀ TRANG CHỦ */

function goHome() {

    document
        .querySelectorAll(".page")
        .forEach(function(section) {

            section.classList.remove(
                "active"
            );

        });


    document
        .getElementById("home")
        .style.display = "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}

</script>

</body>
</html>
